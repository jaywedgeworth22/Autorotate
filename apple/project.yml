# =============================================================================
# Autorotate — XcodeGen project spec (apple/project.yml)
#
# Generates Autorotate.xcodeproj containing the Apple-platform app targets, all
# linking the local SwiftPM package AutorotateCore (no third-party deps).
#
#   brew install xcodegen
#   cd apple && xcodegen generate
#   open Autorotate.xcodeproj
#
# Capabilities to enable in Xcode after generating (Signing & Capabilities):
#   - Keychain Sharing: $(AppIdentifierPrefix)codes.autorotate.shared
#     (already declared in Autorotate-iOS/Autorotate.entitlements)
#   - Background Modes: "Background fetch" (matches Info.plist)
#   - Push Notifications: NOT needed (notifications are local-only)
#
# Both app targets (iOS + macOS) are defined below.
# =============================================================================

name: Autorotate
options:
  bundleIdPrefix: codes.autorotate
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

packages:
  AutorotateCore:
    path: AutorotateCore

settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift toolchain language mode
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CC8UTF7ATG

targets:

  # ── iOS app ────────────────────────────────────────────────────────────────
  Autorotate-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Autorotate-iOS
        excludes:
          - "Autorotate.entitlements"
          - "Info.plist"
    dependencies:
      - package: AutorotateCore
        product: AutorotateCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: codes.autorotate
        PRODUCT_NAME: Autorotate
        CODE_SIGN_ENTITLEMENTS: Autorotate-iOS/Autorotate.entitlements
        INFOPLIST_FILE: Autorotate-iOS/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Autorotate.Codes
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CC8UTF7ATG

  # ── macOS app ──────────────────────────────────────────────────────────────
  Autorotate-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Autorotate-macOS
        excludes:
          - "AutorotateMac.entitlements"
    dependencies:
      - package: AutorotateCore
        product: AutorotateCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autorotate.macos
        PRODUCT_NAME: Autorotate
        CODE_SIGN_ENTITLEMENTS: Autorotate-macOS/AutorotateMac.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Autorotate.Codes
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: CC8UTF7ATG

schemes:
  Autorotate-macOS:
    build:
      targets:
        Autorotate-macOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Autorotate-iOS:
    build:
      targets:
        Autorotate-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

