name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes for this tag from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section found for v$VERSION" > release_notes.md
          fi
          echo "--- release notes ---"
          cat release_notes.md

      - name: Zip apple/ sources
        run: |
          zip -r autorotate-apple-sources.zip apple \
            -x '*/.build/*' '*/DerivedData/*' '*.xcworkspace/*' '*/xcuserdata/*'

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: autorotate-apple-sources.zip
          generate_release_notes: false

  android-release:
    name: Build & Sign Android Release APK
    runs-on: ubuntu-latest
    # Runs after `release` so the GitHub Release already exists for this tag —
    # this job only appends the signed APK as an additional asset (see
    # android/RELEASE.md for the full process and AR-33/AR-13/AR-34/13
    # background).
    needs: release
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # GitHub Actions `if:` can read secrets directly, but only as a plain
      # boolean-ish comparison — funnel it through a step output so every
      # later step in this job can gate on the same check.
      - name: Check release-signing secrets are configured
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 repo secret is not set — skipping the signed Android release build for this tag. No unsigned or debug-signed APK is uploaded instead (AR-13/AR-33: a debug-signed release APK ships with every Android SDK install and can be forged into a trusted update by anyone). See android/RELEASE.md to create the upload keystore and add the required secrets."
          fi

      - name: Write keystore.properties and decode the upload keystore
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          cat > keystore.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Derive versionName/versionCode from the tag
        if: steps.keystore.outputs.present == 'true'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"
          echo "ANDROID_VERSION_NAME=$TAG_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$(( (MAJOR * 10000) + (MINOR * 100) + PATCH ))" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Runs even if the build step above failed, so a partially-built runner
      # never leaves the decoded keystore behind.
      - name: Remove the decoded keystore from the runner
        if: always() && steps.keystore.outputs.present == 'true'
        working-directory: android
        run: rm -f upload-keystore.jks keystore.properties

      - name: Upload signed APK to the GitHub Release
        if: steps.keystore.outputs.present == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
