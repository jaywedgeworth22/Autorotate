name: TestFlight Publish

on:
  workflow_dispatch:

jobs:
  testflight:
    name: Build & Push to TestFlight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Set up Keychain & Certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_P12_PASS }}
        run: |
          # Create a temporary keychain
          security create-keychain -p "" build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Decode and import the certificate
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Setup App Store Connect API Key
        env:
          API_KEY_CONTENT: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8

      - name: Create exportOptions.plist
        working-directory: apple
        run: |
          cat << 'PLIST' > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>CC8UTF7ATG</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive and Export macOS App
        working-directory: apple
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild clean archive -scheme Autorotate-macOS -archivePath build/Autorotate-macOS.xcarchive -allowProvisioningUpdates -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID
          xcodebuild -exportArchive -archivePath build/Autorotate-macOS.xcarchive -exportOptionsPlist exportOptions.plist -exportPath build/macOS -allowProvisioningUpdates -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID
          xcrun altool --upload-app -f build/macOS/Autorotate.pkg -t macos --apiKey $KEY_ID --apiIssuer $ISSUER_ID

      - name: Archive and Export iOS App
        working-directory: apple
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild clean archive -scheme Autorotate-iOS -archivePath build/Autorotate-iOS.xcarchive -destination "generic/platform=iOS" -allowProvisioningUpdates -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID
          xcodebuild -exportArchive -archivePath build/Autorotate-iOS.xcarchive -exportOptionsPlist exportOptions.plist -exportPath build/iOS -allowProvisioningUpdates -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID
          xcrun altool --upload-app -f build/iOS/Autorotate.ipa -t ios --apiKey $KEY_ID --apiIssuer $ISSUER_ID
