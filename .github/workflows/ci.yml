name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pin npm 11 (npm 10 exit-handler crash on this lockfile)
        run: npm install -g npm@11.6.2

      - name: Install, typecheck, build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

  apple:
    name: Apple (AutorotateCore + iOS + macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          else
            echo "Xcode_26.app not found, keeping default: $(xcode-select -p)"
            xcode-select -p
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build & test AutorotateCore (SwiftPM)
        working-directory: apple/AutorotateCore
        run: |
          swift build
          swift test

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Build iOS app
        run: >-
          xcodebuild -project apple/Autorotate.xcodeproj -scheme Autorotate-iOS
          -destination 'generic/platform=iOS Simulator'
          build CODE_SIGNING_ALLOWED=NO

      - name: Build macOS app
        run: >-
          xcodebuild -project apple/Autorotate.xcodeproj -scheme Autorotate-macOS
          -destination 'platform=macOS'
          build CODE_SIGNING_ALLOWED=NO

  android:
    name: Android Companion App (android/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android App (Assemble Debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

