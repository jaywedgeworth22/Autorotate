name: Auto Update PRs

on:
  push:
    branches:
      - main

# FLEET-INFRA-C5: GITHUB_TOKEN defaults to read-only without this block, so
# chinthakagodawita/autoupdate could never push the merge commit onto open PR
# branches — every run failed. Grant exactly what it needs: write contents to
# push, write pull-requests so it can read/update PR state.
permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - name: Automatically update PRs
        uses: chinthakagodawita/autoupdate@v1.22.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          merge_msg: "chore: auto-update branch with main"
          pr_filter: "auto_merge"
          exclude_labels: "do-not-update"
          retry_interval: "2"
          retry_count: "3"
          update_limit: "5"
