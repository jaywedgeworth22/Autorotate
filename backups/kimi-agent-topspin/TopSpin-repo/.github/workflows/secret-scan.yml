name: Secret Scan

# Hard gate for the public repo: no credential material may ever land on main.
# TopSpin's core invariant is zero-plaintext storage — the repo itself must
# honor it too. Gitleaks scans the full history on every push/PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — leaks hide in old commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # optional, OSS-free without it
